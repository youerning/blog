[project]
name = "bt-sniff"
version = "0.1.0"
description = "Minimal BitTorrent DHT sniffer: harvest infohashes and torrent metadata"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["libtorrent>=2.0.11"]

[project.scripts]
bt-sniff = "bt_sniff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bt_sniff"]

[tool.uv]
package = true
